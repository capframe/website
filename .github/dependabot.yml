# Without this file the repo had security *alerts* but no update PRs, so
# 30 advisories accumulated silently (17 high) while Next.js sat a minor
# version behind the fix. Alerts tell you; only this opens the PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types: [patch]
      minor-updates:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
